name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      # Taps this checkout as duneanalytics/tap.
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew readall --os=all --arch=all duneanalytics/tap
      - run: brew style duneanalytics/tap
